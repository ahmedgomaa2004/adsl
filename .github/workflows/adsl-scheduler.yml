name: Vodafone ADSL to Telegram

on:
  workflow_dispatch:
  schedule:
    # UTC time. Change as needed.
    - cron: "0 */8 * * *"

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Africa/Cairo
      VODA_MOBILE: ${{ secrets.VODA_MOBILE }}
      VODA_PASSWORD: ${{ secrets.VODA_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_BROWSER_CHANNEL: ""
      SEND_ERROR_TO_TELEGRAM: "true"
      DEBUG_SAVE_ADSL_RESPONSE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Validate required secrets
        run: |
          for name in VODA_MOBILE VODA_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Run script
        run: python vodafone_adsl_to_telegram.py
